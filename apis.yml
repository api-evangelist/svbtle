aid: svbtle
name: Svbtle
description: >-
  Svbtle is a minimalist publishing and blogging platform designed to work the
  way your brain does, pairing a distraction-free Markdown editor with a simple
  dashboard for organizing drafts, developing ideas, and publishing to a clean
  reading experience. Created by Dustin Curtis and operated by Neutral
  Corporation, Svbtle emphasizes longevity through its "Forever Promise" that
  published writing remains permanently accessible online. Svbtle is a
  subscription-based writer's network rather than a developer platform: as of
  this enrichment pass it publishes no public API, developer portal, OpenAPI
  definition, OAuth authorization server, or .well-known metadata, and each blog
  is exposed only as a human-readable site with an RSS feed.
